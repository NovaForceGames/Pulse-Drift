name: Android AAB package (unsigned test only)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'privacy.html'
      - '.github/workflows/android-aab.yml'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install Android API 36
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned Android App Bundle
        run: gradle --no-daemon -p android :app:bundleRelease
      - name: Verify output
        shell: bash
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB package compiled. UNSIGNED: NOT READY FOR PLAY CONSOLE UPLOAD."
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-DRIFT-AAB-UNSIGNED-NOT-FOR-PLAY
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
