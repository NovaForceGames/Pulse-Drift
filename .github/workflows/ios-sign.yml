name: iOS signed IPA preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/ios-preparation'
    runs-on: macos-26-intel
    environment: ios-distribution
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install distribution certificate and profile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DIST_CERT_P12_BASE64"
          test -n "$DIST_CERT_PASSWORD"
          test -n "$APPSTORE_PROFILE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist-cert.p12"
          security import "$RUNNER_TEMP/dist-cert.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/fe55c3f7-5095-49bc-a512-3a5686a5934b.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Archive with manual distribution signing
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/PulseDrift.xcodeproj -scheme PulseDrift \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PulseDrift.xcarchive" \
            DEVELOPMENT_TEAM=ZLJWD7847A CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=Pulse Drift App Store"
      - name: Export signed IPA locally (no Apple upload)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>ZLJWD7847A</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>provisioningProfiles</key><dict>
          <key>games.novaforce.pulsedrift</key><string>Pulse Drift App Store</string>
          </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PulseDrift.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          test -n "$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
      - name: Retain signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist-cert.p12"
