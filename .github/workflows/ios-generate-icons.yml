name: Generate iOS icons from original SVG

on:
  push:
    paths:
      - 'scripts/generate_ios_icons.py'
      - 'ios/PulseDrift/Assets.xcassets/AppIcon.appiconset/Contents.json'
      - '.github/workflows/ios-generate-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: macos-26-intel
    steps:
      - name: Checkout iOS preparation
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image converter
        run: |
          python -m pip install --disable-pip-version-check Pillow CairoSVG

      - name: Generate all AppIcon PNG files
        run: python scripts/generate_ios_icons.py

      - name: Verify required app icon catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p = Path('ios/PulseDrift/Assets.xcassets/AppIcon.appiconset')
          d = json.loads((p/'Contents.json').read_text())
          for item in d['images']:
              f = p / item['filename']
              assert f.exists(), f
              icon = Image.open(f)
              assert icon.mode == 'RGB', f
          print('Asset catalog complete.')
          PY

      - name: Commit generated icons to isolated iOS branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/PulseDrift/Assets.xcassets/AppIcon.appiconset/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add full-resolution iOS app icons generated from original SVG'
            git push origin HEAD:ios-preparation
          else
            echo 'All icon files already exist.'
          fi
