name: Android test APK (AdMob demo ads only)
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'privacy.html'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes the Android SDK and sdkmanager.
      # The setup-android action failed while replacing command-line tools,
      # so use the runner's preinstalled SDK instead.
      - name: Check installed Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: Install Android API 36 if missing
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile test APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PulseDrift-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
