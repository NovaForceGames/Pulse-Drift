name: Android test APK (AdMob demo ads only)
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'privacy.html'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

jobs:
  build:
    # Pin stable runner; ubuntu-latest currently uses 26.04, where sdkmanager is not on PATH.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes the Android SDK and sdkmanager.
      # The setup-android action failed while replacing command-line tools,
      # so use the runner's preinstalled SDK instead.
      - name: Locate preinstalled Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found beneath $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 3 -type d | head -n 80
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install Android API 36
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile test APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PulseDrift-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
