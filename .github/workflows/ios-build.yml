name: iOS build and resource check

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/PulseDrift.xcodeproj \
            -scheme PulseDrift \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Verify game is bundled offline
        run: |
          APP="build/Build/Products/Release-iphoneos/PulseDrift.app"
          test -d "$APP" || { echo "::error::Missing iOS app bundle"; exit 1; }
          test -s "$APP/Game/index.html" || { echo "::error::Game HTML missing from app bundle"; exit 1; }
          test -s "$APP/Game/privacy.html" || { echo "::error::Privacy document missing from app bundle"; exit 1; }
          test -s "$APP/Game/icon.svg" || { echo "::error::Game icon SVG missing from app bundle"; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "games.novaforce.pulsedrift"
          echo "Offline game resources and bundle identifier verified."

      - name: Package unsigned build for technical inspection
        run: |
          cd build/Build/Products/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/PulseDrift-iOS-unsigned.zip" PulseDrift.app

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app-not-installable
          path: PulseDrift-iOS-unsigned.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
