name: iOS build check
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ios/PulseDrift.xcodeproj -scheme PulseDrift -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
